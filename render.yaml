# Render Blueprint — New → Blueprint ile bu depoyu seçin.
#
# - Render'ın yönetilen PostgreSQL'inde H3 eklentisi yok → veritabanı kalıcı diskli bir Docker
#   "private service" (db/Dockerfile: PostGIS + H3).
# - Tarayıcı yalnızca web servisini görür; web, /api/* isteklerini Render iç ağı üzerinden
#   API'ye aktarır (CORS ve API'nin genel adresi gerekmez).
# - İç ağ için tüm servisler AYNI bölgede olmalı.
#
# İlk kurulumda veriyi doldurmanın iki yolu (README → Deploy on Render):
#   (a) Hızlı: yerelde `pnpm db:dump`, dosyayı bir URL'ye yükleyin, astraforce-db'de DUMP_URL verin
#       (veritabanının İLK açılışından önce).
#   (b) Yavaş (~1,5 sa): astraforce-update cron işinde bir kez
#       `python -m app.update --bootstrap` çalıştırın.
services:
  - type: pserv
    name: astraforce-db
    runtime: docker
    region: frankfurt
    dockerfilePath: ./db/Dockerfile
    dockerContext: ./db
    plan: standard            # 2 GB RAM
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 20
    envVars:
      - key: POSTGRES_USER
        value: astra
      - key: POSTGRES_DB
        value: astraforce
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata   # disk kökündeki lost+found ile çakışmasın
      - key: DUMP_URL
        sync: false                              # isteğe bağlı: yedeğin indirme bağlantısı

  - type: web
    name: astraforce-api
    runtime: docker
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DB_HOSTPORT
        fromService: { type: pserv, name: astraforce-db, property: hostport }
      - key: POSTGRES_PASSWORD
        fromService: { type: pserv, name: astraforce-db, envVarKey: POSTGRES_PASSWORD }
      - key: FIRMS_MAP_KEY
        sync: false

  - type: web
    name: astraforce-web
    runtime: docker
    region: frankfurt
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      # Derleme argümanı: /api/* → http://<bu adres> (Render iç ağı)
      - key: API_HOSTPORT
        fromService: { type: web, name: astraforce-api, property: hostport }

  - type: cron
    name: astraforce-update
    runtime: docker
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: standard             # ABD harmonizasyonu ~2–3 GB RAM ister; gerekirse "pro"
    schedule: "30 5 * * *"     # her gün 05:30 UTC (FIRMS gece işlemesinden sonra)
    dockerCommand: python -m app.update
    envVars:
      - key: DB_HOSTPORT
        fromService: { type: pserv, name: astraforce-db, property: hostport }
      - key: POSTGRES_PASSWORD
        fromService: { type: pserv, name: astraforce-db, envVarKey: POSTGRES_PASSWORD }
      - key: FIRMS_MAP_KEY
        sync: false
